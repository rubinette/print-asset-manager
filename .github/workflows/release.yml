name: Release

# Pushing a `v*` tag (e.g. `v0.1.0`, matching the workspace version) builds the
# macOS and Linux packages and attaches them to a draft GitHub Release, which
# is published by hand. Pull requests that touch packaging build the same
# packages as workflow artifacts without releasing anything.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pam-app") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p pam-app --release --locked --target aarch64-apple-darwin
      - run: cargo build -p pam-app --release --locked --target x86_64-apple-darwin
      - name: Bundle
        run: |
          mkdir -p dist
          lipo -create -output dist/print-asset-manager \
            target/aarch64-apple-darwin/release/print-asset-manager \
            target/x86_64-apple-darwin/release/print-asset-manager
          packaging/macos/bundle.sh dist/print-asset-manager "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    needs: version
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    # The oldest supported Ubuntu, so the binary runs on any glibc since 2.35.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p pam-app --release --locked
      - name: Package
        run: |
          mkdir -p dist
          packaging/linux/package.sh target/release/print-asset-manager \
            "${{ needs.version.outputs.version }}" ${{ matrix.arch }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
